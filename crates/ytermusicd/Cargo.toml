[package]
name = "ytermusicd"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Headless YouTube Music daemon with a web UI, MPRIS and MCP"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
env_logger = "0.11"
log = "0.4"
tokio = { version = "1.36", features = ["rt-multi-thread", "signal"] }

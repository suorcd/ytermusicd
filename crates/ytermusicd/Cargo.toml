[package]
name = "ytermusicd"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Headless YouTube Music daemon with a web UI, MPRIS and MCP"

[dependencies]
axum = "0.8"
clap = { version = "4.5", features = ["derive", "env"] }
env_logger = "0.11"
log = "0.4"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1.36", features = ["macros", "net", "rt-multi-thread", "signal"] }
ytermusicd-core.workspace = true

[dev-dependencies]
reqwest = { version = "0.11", default-features = false, features = ["rustls-tls"] }
serde_json = "1"

[package]
name = "ytermusicd"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Headless YouTube Music daemon with a web UI, MPRIS and MCP"

[dependencies]
async-stream = "0.3"
async-trait = "0.1"
axum = "0.8"
clap = { version = "4.5", features = ["derive", "env"] }
common-structs.workspace = true
database.workspace = true
download-manager.workspace = true
env_logger = "0.11"
flume = "0.11"
futures-util = "0.3"
log = "0.4"
mime_guess = "2"
player.workspace = true
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls", "stream"] }
rmcp = { version = "3.10", features = ["transport-io"] }
rust-embed = { version = "8", features = ["interpolate-folder-path"] }
schemars = "1.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
souvlaki = "0.7.3"
tokio = { version = "1.36", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
ytermusicd-api = { workspace = true, features = ["schema"] }
ytermusicd-core.workspace = true
ytpapi2.workspace = true

[dev-dependencies]
common-structs.workspace = true
serde_json = "1"

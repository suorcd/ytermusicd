name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build and package (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-14
            target: x86_64-apple-darwin

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libdbus-1-dev pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Build ytermusicd
        run: cargo build --release --target ${{ matrix.target }} -p ytermusicd

      - name: Build web UI (if present)
        if: ${{ hashFiles('crates/ytermusicd-web/package.json') != '' }}
        working-directory: crates/ytermusicd-web
        run: |
          npm ci
          npm run build

      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          name="ytermusicd-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/ytermusicd" dist/ytermusicd
          if [ -d crates/ytermusicd-web/dist ]; then
            cp -R crates/ytermusicd-web/dist dist/web
          fi
          tar -czf "${name}.tar.gz" -C dist .
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256"
          else
            shasum -a 256 "${name}.tar.gz" > "${name}.tar.gz.sha256"
          fi

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "ytermusicd-$env:GITHUB_REF_NAME-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/ytermusicd.exe" "dist/ytermusicd.exe"
          if (Test-Path "crates/ytermusicd-web/dist") {
            Copy-Item -Recurse "crates/ytermusicd-web/dist" "dist/web"
          }
          Compress-Archive -Path "dist/*" -DestinationPath "$name.zip"
          Get-FileHash "$name.zip" -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $name.zip" } |
            Set-Content "$name.zip.sha256"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ytermusicd-${{ matrix.target }}
          path: |
            ytermusicd-*.tar.gz
            ytermusicd-*.tar.gz.sha256
            ytermusicd-*.zip
            ytermusicd-*.zip.sha256
          if-no-files-found: error

      - name: Publish release assets
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ytermusicd-*.tar.gz
            ytermusicd-*.tar.gz.sha256
            ytermusicd-*.zip
            ytermusicd-*.zip.sha256
